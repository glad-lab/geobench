version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: adversarial-seo-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adversarial-seo-app
    ports:
      - "8888:8888"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./config:/app/config
      - ./docs:/app/docs
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - JUPYTER_ENABLE_LAB=yes
    env_file:
      - .env
    depends_on:
      - qdrant
    restart: unless-stopped
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

  # Optional: Separate service for running experiments
  experiment-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adversarial-seo-experiments
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    env_file:
      - .env
    depends_on:
      - qdrant
    profiles:
      - experiments
    command: python -m src.experiments --config config/experiment_config.json

volumes:
  qdrant-storage:
    driver: local

networks:
  default:
    name: adversarial-seo-network