name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout pytest-xdist

      - name: Verify Qdrant service
        run: |
          curl http://localhost:6333/health
          echo "Qdrant is healthy"

      - name: Run integration tests (fast)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_DOCKER_QDRANT: false
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/integration/ \
            -v \
            -m "integration and not slow" \
            --tb=short \
            --maxfail=5 \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --timeout=300

      - name: Run slow integration tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_DOCKER_QDRANT: false
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/integration/ \
            -v \
            -m "integration and slow" \
            --tb=short \
            --maxfail=3 \
            --timeout=600

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: integration
          name: integration-${{ matrix.python-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
            .coverage
            coverage.xml

      - name: Publish test report
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: '**/test-results-*.xml'
          check_name: Integration Test Report (${{ matrix.python-version }})

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark pytest-timeout

      - name: Run performance benchmarks
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          USE_DOCKER_QDRANT: false
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/integration/test_performance_benchmarks.py \
            -v \
            --tb=short \
            --timeout=600 \
            --benchmark-only \
            --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Comment benchmark results
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true

  integration-matrix:
    name: Provider Integration Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        provider: [openai, anthropic]
      fail-fast: false

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run provider-specific tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_DOCKER_QDRANT: false
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/integration/test_multi_provider_workflow.py \
            -v \
            -k "test_provider_experiment[${{ matrix.provider }}]" \
            --tb=short \
            --timeout=300

  docker-integration:
    name: Docker-based Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout docker

      - name: Run Docker-based tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          USE_DOCKER_QDRANT: true
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/integration/test_database_operations.py \
            -v \
            -m "integration and requires_docker" \
            --tb=short \
            --timeout=300

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [integration-tests, performance-benchmarks, integration-matrix, docker-integration]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Performance Benchmarks: ${{ needs.performance-benchmarks.result }}"
          echo "Integration Matrix: ${{ needs.integration-matrix.result }}"
          echo "Docker Integration: ${{ needs.docker-integration.result }}"

      - name: Fail if any tests failed
        if: |
          needs.integration-tests.result == 'failure' ||
          needs.docker-integration.result == 'failure'
        run: exit 1
