[pytest]
# Pytest configuration for adversarial-seo project

# Markers
markers =
    integration: Integration tests requiring real services
    slow: Slow tests taking >30 seconds
    requires_api: Tests requiring API keys
    requires_docker: Tests requiring Docker

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Paths
testpaths = tests

# Timeout
timeout = 300
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
