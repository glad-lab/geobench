wandb:
  entity: "nimase"
  project: "controllable-seo"

method: 'grid'
name: 'seo_suffix'
metric: 
    name: 'eval/product_rank'
    goal: 'minimize'   

parameters: 
  seed:
    value: 42
  model: 
    value: mistral-7b
  mode:
    value: "suffix"
  dataset:
    value: "ragdoll"
  batch_size: 
    value: 2
  length: 
    value: 30
  temperature:
    value: 0.1
  lr: 
    value: 0.03
  topk: 
    value: 10
  num_iter: 
    value: 2000
  test_iter: 
    value: 100
  precision: 
    value: 16
  fluency:
    value: 1
  ngram:
    value: 5
  target:
    value: 50
  similarity:
    value: 1
  iter_steps:
    value: [0, 50, 200, 500, 1500]
  noise_stds:
    value: [0.1, 0.05, 0.01, 0.005, 0.001]
  catalog: 
    values: ["barbecue_grill", "computer_power_supply", "laptop", "pool_cleaner", "washing_machine"]
  random_order: 
    value: True 
  random_inference:
    value: True
  target_product_idx: 
    values: [1, 2, 3, 4, 5, 6, 7, 8]
  result_dir:
    value: "results_new/benchmark_results/suffix/v1"
  comment:
    value: "main experiment"